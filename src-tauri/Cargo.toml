[package]
name = "deact"
version = "0.1.0"
edition = "2021"
description = "DeACT — portable Windows desktop auto copy-trading application (Phase 1: Tauri 2 foundation, no trading functionality yet)"
default-run = "deact"

[lib]
name = "deact_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Diagnostic builds only: enables the `--inject-failure` startup fault
# injection used to verify the Windows GUI error feedback on a real
# machine. Never enable this feature for a release build.
fault-injection = []

[build-dependencies]
tauri-build = "=2.7.5"

[dependencies]
tauri = "=2.12.6"
tokio = { version = "=1.53.3", features = ["sync", "time"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.12"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "registry"] }
tracing-appender = "=0.2.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Keep release builds debuggable enough for a foundation-stage artifact.
debug = false
